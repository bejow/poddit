name: Cypress E2E Tests

on:
  pull_request:
    branches: [main]

jobs:
  api:
    name: Prepare Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: 16.15
      - uses: actions/checkout@v3
        with:
          repository: bejow/poddit-backend
          token: ${{ secrets.PODDIT_BACKEND }}
          ref: main
          path: backend
      - run: npm install
      - run: npm run prod

  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cypress run
        uses: cypress-io/github-action@v4
        with:
          build: npm run build
          start: npm start
          record: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
